spring:
  jpa:
    show-sql: false
  flyway:
    url: ${SPRING_FLYWAY_URL:jdbc:postgresql://postgres:5432/schoolms}

app:
  jwt:
    secret: ${JWT_SECRET}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}

logging:
  level:
    com.schoolms: INFO
