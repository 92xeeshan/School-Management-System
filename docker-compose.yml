name: schoolms

services:
  postgres:
    image: postgres:15-alpine
    container_name: schoolms-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schoolms}
      POSTGRES_USER: ${POSTGRES_USER:-schoolms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schoolms}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schoolms}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: schoolms-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: schoolms-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-schoolms}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-schoolms}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-schoolms}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-schoolms}
      SPRING_FLYWAY_USER: ${POSTGRES_USER:-schoolms}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-schoolms}
      MINIO_ENDPOINT: http://minio:9000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod-please-32chars-min}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: schoolms-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
